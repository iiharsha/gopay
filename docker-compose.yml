services:
  postgres:
    image: postgres:17-alpine
    container_name: gopay
    environment:
      POSTGRES_USER: gopay
      POSTGRES_PASSWORD: gopay
      POSTGRES_DB: gopay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: gopay-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2.11-alpine
    container_name: gopay-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  pgdata:
